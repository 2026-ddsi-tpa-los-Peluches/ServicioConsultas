


logging.level.ar.edu.utn.dds.k3003=INFO


spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true
spring.rabbitmq.addresses=${RABBITMQ_URL}
spring.rabbitmq.listener.simple.default-requeue-rejected=false




spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# datadog
management.datadog.metrics.export.enabled=${DATADOG_ENABLED:false}
management.datadog.metrics.export.api-key=${DATADOG_API_KEY:}
management.datadog.metrics.export.application-key=${DATADOG_APP_KEY:}
management.datadog.metrics.export.step=1m
management.datadog.metrics.export.uri=${DATADOG_URI:https://api.datadoghq.com}/
management.metrics.tags.modulo=donaciones



# Microservicios
INCENTIVOS_SERVICE_URL=https://incentivos-cxk9.onrender.com
LOGISTICA_SERVICE_URL=https://logistica-7m62.onrender.com
server.port=${PORT:8080}